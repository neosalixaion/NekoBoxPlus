name: ShadowQUIC validation APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true

      - run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Build bundled assets and native core
        run: |
          cd workspace/NekoBoxForAndroid
          bash buildScript/lib/assets.sh
          mkdir -p "$GITHUB_WORKSPACE/workspace/sing-box/common/adblock/adblockrust/resources/files"
          touch "$GITHUB_WORKSPACE/workspace/sing-box/common/adblock/adblockrust/resources/files/placeholder.txt"
          bash buildScript/lib/core.docker.sh

      - name: Build isolated debug APK
        run: |
          cd workspace/NekoBoxForAndroid
          ./gradlew app:assemblePlusDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NekoBoxPlus-ShadowQUIC-debug
          path: workspace/NekoBoxForAndroid/app/build/outputs/apk/plus/debug/*.apk
          if-no-files-found: error
